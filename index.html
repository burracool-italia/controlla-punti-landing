<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controlla Punti</title>
<style>
  :root {
    --primario: #1AACA0;
    --scuro: #1a1a2e;
    --superficie: #ffffff;
    --inchiostro: #1a1a2e;
    --inchiostro-tenue: #6b6b7a;
    --bordo: #e2e6ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --superficie: #14141f;
      --inchiostro: #f0f0f5;
      --inchiostro-tenue: #a0a0b0;
      --bordo: #2a2a3a;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--scuro);
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    color: var(--inchiostro);
  }
  .pagina {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 48px 24px;
  }
  .icona {
    width: 108px; height: 108px;
    border-radius: 24px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  h1 {
    color: #ffffff;
    font-size: 30px;
    margin: 20px 0 6px;
    text-align: center;
  }
  .tagline {
    color: #b8c4d0;
    font-size: 15px;
    margin: 0 0 32px;
    text-align: center;
    max-width: 320px;
  }
  .scheda {
    background: var(--superficie);
    border-radius: 20px;
    padding: 28px 24px;
    width: 100%; max-width: 360px;
    box-shadow: 0 10px 32px rgba(0,0,0,0.3);
  }
  .bottone {
    display: block;
    text-decoration: none;
    text-align: center;
    padding: 15px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 16px;
    margin-bottom: 14px;
  }
  .bottone:last-of-type { margin-bottom: 0; }
  .bottone-android { background: var(--primario); color: #ffffff; }
  .bottone-ios { background: transparent; color: var(--inchiostro); border: 2px solid var(--bordo); }
  .nota {
    color: var(--inchiostro-tenue);
    font-size: 12px;
    text-align: center;
    margin-top: 14px;
  }
  footer {
    margin-top: 32px;
    text-align: center;
  }
  footer a {
    color: #8fa3b0;
    font-size: 12px;
    text-decoration: underline;
  }
</style>
</head>
